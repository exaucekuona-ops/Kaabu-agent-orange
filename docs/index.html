<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaabu Agent</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #0b141a; color: #e9edef; margin: 0; }
  .ecran { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  .hidden { display: none !important; }
  .centre { justify-content: center; padding: 24px; gap: 12px; }
  .centre h1 { margin: 0 0 8px; font-size: 1.5rem; }
  input { background: #2a3942; border: 1px solid #222e35; border-radius: 8px; color: #fff; padding: 12px; font-size: 1rem; outline: none; }
  button { border: none; border-radius: 8px; padding: 12px; font-weight: 600; font-size: 1rem; cursor: pointer; }
  .primaire { background: #00a884; color: #111b21; }
  .secondaire { background: #202c33; color: #e9edef; }
  .entete { background: #111b21; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222e35; }
  .zone { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .bulle { max-width: 75%; padding: 8px 12px; border-radius: 8px; word-wrap: break-word; }
  .bulle.moi { background: #005c4b; align-self: flex-end; }
  .bulle.autre { background: #202c33; align-self: flex-start; }
  .bulle strong { font-size: 0.8rem; color: #8696a0; }
  .barre { background: #111b21; padding: 10px; display: flex; gap: 8px; }
  .barre input { flex: 1; border-radius: 24px; }
  .envoi { width: 46px; height: 46px; border-radius: 50%; background: #00a884; color: #111b21; padding: 0; }
  .admin { position: fixed; inset: 0; background: #0b141a; z-index: 10; overflow-y: auto; }
  .ligne { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid #222e35; }
  .ligne small { color: #8696a0; display: block; }
  .ligne button { padding: 8px 12px; font-size: 0.9rem; margin-left: 6px; }
  .danger { background: #dc2626; color: #fff; }
  .barre .ico { width: 42px; height: 42px; border-radius: 50%; background: #202c33; color: #e9edef; padding: 0; flex: none; }
  .barre .ico.rec { background: #dc2626; color: #fff; }
  .bulle img { max-width: 100%; border-radius: 6px; display: block; margin-top: 4px; }
  .bulle audio { width: 220px; max-width: 100%; margin-top: 4px; }
</style>
</head>
<body>

<div id="login" class="ecran centre hidden">
  <h1>Kaabu Agent</h1>
  <input id="email" type="email" placeholder="E-mail" autocomplete="email">
  <input id="mdp" type="password" placeholder="Mot de passe" autocomplete="current-password">
  <button class="primaire" onclick="connexion(false)">Se connecter</button>
  <button class="secondaire" onclick="connexion(true)">Créer un compte</button>
</div>

<div id="attente" class="ecran centre hidden">
  <h1 id="attente-titre">Compte en attente</h1>
  <p id="attente-msg"></p>
  <button class="primaire" onclick="demarrer()">Vérifier à nouveau</button>
  <button class="secondaire" onclick="deconnexion()">Se déconnecter</button>
</div>

<div id="chat" class="ecran hidden">
  <div class="entete">
    <strong>SERVICES DE TOUT RÉSEAUX</strong>
    <span>
      <i id="btn-admin" class="fa-solid fa-user-shield hidden" style="cursor:pointer;margin-right:18px" onclick="ouvrirAdmin()"></i>
      <i class="fa-solid fa-right-from-bracket" style="cursor:pointer" onclick="deconnexion()"></i>
    </span>
  </div>
  <div id="zone" class="zone"></div>
  <div class="barre">
    <input id="fichier" type="file" accept="image/*" class="hidden" onchange="envoyerPhoto(this)">
    <button class="ico" onclick="$('fichier').click()"><i class="fa-solid fa-image"></i></button>
    <input id="texte" type="text" placeholder="Message" onkeydown="if(event.key==='Enter')envoyer()">
    <button id="micro" class="ico" onclick="basculerMicro()"><i class="fa-solid fa-microphone"></i></button>
    <button class="envoi" onclick="envoyer()"><i class="fa-solid fa-paper-plane"></i></button>
  </div>
</div>

<div id="admin" class="admin hidden">
  <div class="entete">
    <strong>Comptes</strong>
    <i class="fa-solid fa-xmark" style="cursor:pointer" onclick="fermerAdmin()"></i>
  </div>
  <div id="liste"></div>
</div>

<script>
  // À REMPLACER par les valeurs de Supabase (Project Settings > API). Jamais la clé service_role.
  const SUPABASE_URL = 'https://wmrpeeebdswenrshtlcr.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_tXKY7NtjUc8oN_Yh-6t6_g_OQE6OC5b';

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const $ = id => document.getElementById(id);
  let moi = null, canal = null;

  const esc = s => String(s ?? '').replace(/[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function montrer(id) {
    ['login', 'attente', 'chat'].forEach(x => $(x).classList.toggle('hidden', x !== id));
  }

  async function demarrer() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return montrer('login');
    const { data: p } = await sb.from('profiles').select('nom,statut,is_admin').eq('id', session.user.id).single();
    moi = { id: session.user.id, ...p };
    if (!p || p.statut !== 'admis') {
      const banni = p && p.statut === 'banni';
      $('attente-titre').textContent = banni ? 'Compte banni' : 'Compte en attente';
      $('attente-msg').textContent = banni
        ? "L'administrateur a banni ce compte."
        : "Ton compte doit être validé par l'administrateur avant d'accéder au chat.";
      return montrer('attente');
    }
    montrer('chat');
    $('btn-admin').classList.toggle('hidden', !moi.is_admin);
    await chargerMessages();
    ecouter();
  }

  async function connexion(creer) {
    const email = $('email').value.trim(), password = $('mdp').value;
    if (!email || !password) return alert('Entre ton e-mail et ton mot de passe.');
    const r = creer ? await sb.auth.signUp({ email, password })
                    : await sb.auth.signInWithPassword({ email, password });
    if (r.error) return alert(r.error.message);
    if (creer && !r.data.session) return alert('Compte créé. Confirme ton e-mail, puis connecte-toi.');
    demarrer();
  }

  async function deconnexion() {
    if (canal) sb.removeChannel(canal);
    await sb.auth.signOut();
    montrer('login');
  }

  function ajouter(m) {
    const estMoi = m.auteur === moi.id, media = m.type !== 'texte';
    $('zone').insertAdjacentHTML('beforeend',
      `<div class="bulle ${estMoi ? 'moi' : 'autre'}"><strong>${esc(m.auteur_nom)}</strong><br><span id="m${m.id}">${media ? '…' : esc(m.contenu)}</span></div>`);
    $('zone').scrollTop = $('zone').scrollHeight;
    if (media) afficherMedia(m);
  }

  async function afficherMedia(m) {
    const { data } = await sb.storage.from('chat').createSignedUrl(m.contenu, 3600);
    const url = data ? esc(data.signedUrl) : '';
    $('m' + m.id).innerHTML = !url ? '(fichier indisponible)'
      : m.type === 'image' ? `<img src="${url}" onload="$('zone').scrollTop=$('zone').scrollHeight">`
      : `<audio controls src="${url}"></audio>`;
  }

  async function chargerMessages() {
    const { data } = await sb.from('messages').select('*')
      .order('created_at', { ascending: false }).limit(100);
    $('zone').innerHTML = '';
    (data || []).reverse().forEach(ajouter);
  }

  function ecouter() {
    if (canal) sb.removeChannel(canal);
    canal = sb.channel('chat-general')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, p => ajouter(p.new))
      .subscribe();
  }

  const ETIQUETTE = { en_attente: 'En attente', admis: 'Admis', banni: 'Banni' };

  function fermerAdmin() { $('admin').classList.add('hidden'); }

  async function ouvrirAdmin() {
    $('admin').classList.remove('hidden');
    const { data, error } = await sb.from('profiles')
      .select('id,nom,statut,created_at').order('created_at', { ascending: false });
    if (error) return alert(error.message);
    $('liste').innerHTML = data.map(p => {
      let actions = '<small>Toi</small>';
      if (p.id !== moi.id) {
        actions = (p.statut !== 'admis' ? `<button class="primaire" onclick="changerStatut('${p.id}','admis')">Admettre</button>` : '')
                + (p.statut !== 'banni' ? `<button class="danger" onclick="changerStatut('${p.id}','banni')">Bannir</button>` : '');
      }
      return `<div class="ligne"><div>${esc(p.nom)}<small>${ETIQUETTE[p.statut] || ''}</small></div><div>${actions}</div></div>`;
    }).join('');
  }

  async function changerStatut(id, statut) {
    if (statut === 'banni' && !confirm('Bannir ce compte ?')) return;
    const { error } = await sb.from('profiles').update({ statut }).eq('id', id);
    if (error) return alert(error.message);
    ouvrirAdmin();
  }

  async function televerser(blob, type, ext, contentType) {
    const chemin = `${moi.id}/${Date.now()}.${ext}`;
    const { error } = await sb.storage.from('chat').upload(chemin, blob, { contentType });
    if (error) return alert('Envoi impossible : ' + error.message);
    const r = await sb.from('messages').insert({ auteur: moi.id, type, contenu: chemin });
    if (r.error) { alert('Message non envoyé : ' + r.error.message); demarrer(); }
  }

  function reduire(file) {
    return new Promise((ok, ko) => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, 1280 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k);
        c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(b => b ? ok(b) : ko(new Error('Image illisible')), 'image/jpeg', 0.8);
      };
      img.onerror = () => ko(new Error('Image illisible'));
      img.src = URL.createObjectURL(file);
    });
  }

  async function envoyerPhoto(input) {
    const f = input.files[0];
    input.value = '';
    if (!f) return;
    try { await televerser(await reduire(f), 'image', 'jpg', 'image/jpeg'); }
    catch (e) { alert(e.message); }
  }

  let enregistreur = null, morceaux = [];

  async function basculerMicro() {
    if (enregistreur) { enregistreur.stop(); return; }
    try {
      const flux = await navigator.mediaDevices.getUserMedia({ audio: true });
      const rec = new MediaRecorder(flux);
      morceaux = [];
      rec.ondataavailable = e => morceaux.push(e.data);
      rec.onstop = async () => {
        flux.getTracks().forEach(t => t.stop());
        $('micro').classList.remove('rec');
        enregistreur = null;
        const blob = new Blob(morceaux, { type: 'audio/webm' });
        if (blob.size > 1000) await televerser(blob, 'vocal', 'webm', 'audio/webm');
      };
      rec.start();
      enregistreur = rec;
      $('micro').classList.add('rec');
    } catch (e) { alert('Micro indisponible : ' + e.message); }
  }

  async function envoyer() {
    const t = $('texte').value.trim();
    if (!t) return;
    $('texte').value = '';
    const { error } = await sb.from('messages').insert({ auteur: moi.id, type: 'texte', contenu: t });
    if (error) { alert("Message non envoyé : " + error.message); demarrer(); }
  }

  demarrer();
</script>

</html>
