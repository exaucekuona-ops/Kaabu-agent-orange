<!DOCTYPE html>
<html lang="fr">
<head>
<meta name="build" content="20261001-195027">
<script>
(function(){
  var affiche=false, enCours=false;
  function monTampon(){ var m=document.querySelector('meta[name="build"]'); return m?m.content:null; }
  function toast(t){
    var d=document.createElement('div'); d.textContent=t;
    d.style.cssText='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:99999;background:#075e54;color:#fff;padding:10px 16px;border-radius:20px;font:14px sans-serif';
    document.body.appendChild(d); setTimeout(function(){d.remove();},4000);
  }
  function bandeau(){
    if(affiche||!document.body) return; affiche=true;
    var d=document.createElement('div');
    d.style.cssText='position:fixed;left:0;right:0;top:0;z-index:99999;background:#00a884;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font:15px sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.4)';
    d.innerHTML='<span>Nouvelle mise à jour disponible</span><button style="border:0;border-radius:8px;padding:8px 14px;font-size:15px;font-weight:bold;background:#fff;color:#075e54">Mettre à jour</button>';
    d.querySelector('button').onclick=function(){ location.reload(); };
    document.body.appendChild(d);
  }
  async function verifier(){
    if(enCours) return; enCours=true;
    try{
      var r=await fetch('/?maj='+Date.now(),{cache:'no-store'});
      var t=await r.text();
      var m=t.match(/<meta name="build" content="([^"]*)"/);
      var mien=monTampon();
      if(m && mien && m[1]!==mien) bandeau();
    }catch(e){}
    enCours=false;
  }
  setInterval(verifier,60000);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) verifier(); });
  window.addEventListener('load',function(){
    var b=monTampon();
    try{
      var avant=localStorage.getItem('kaabu_build');
      if(b && b!=='dev'){ if(avant && avant!==b) toast('✅ Application mise à jour'); localStorage.setItem('kaabu_build',b); }
    }catch(e){}
    setTimeout(verifier,3000);
  });
})();
</script>

<script>
  // À REMPLACER par les valeurs de Supabase (Project Settings > API). Jamais la clé service_role.
  const SUPABASE_URL = 'https://wmrpeeebdswenrshtlcr.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_tXKY7NtjUc8oN_Yh-6t6_g_OQE6OC5b';

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { flowType: 'pkce' } });
  function normPhone(s){
    s = s.replace(/[\s\-().]/g,'');
    if (s.startsWith('00')) s = '+' + s.slice(2);
    return /^\+[1-9]\d{7,14}$/.test(s) ? s : null;
  }
  function askPhone(){
    return new Promise(resolve=>{
      const o = document.createElement('div');
      o.id = 'ov-tel';
      o.style.cssText = 'position:fixed;inset:0;background:#111b21;z-index:9999;display:flex;flex-direction:column;justify-content:center;padding:24px;gap:12px;color:#fff';
      o.innerHTML = '<h2>Ton numéro de téléphone</h2><p>Avec l\'indicatif pays (ex. +243812345678). Un numéro = un seul compte.</p><input id="ph" type="tel" placeholder="+243..." style="padding:12px;font-size:16px;border-radius:8px;border:0"><div id="pherr" style="color:#ff6b6b"></div><button id="phok" style="padding:12px;font-size:16px;border:0;border-radius:8px;background:#00a884;color:#fff">Valider</button><button id="phback" style="padding:12px;font-size:16px;border:0;border-radius:8px;background:#2a3942;color:#fff">← Retour</button>';
      document.body.appendChild(o);
      o.querySelector('#phback').onclick = async ()=>{ o.remove(); await deconnexion(); resolve(null); };
      o.querySelector('#phok').onclick = async ()=>{
        const err = o.querySelector('#pherr');
        const p = normPhone(o.querySelector('#ph').value);
        if(!p){ err.textContent = 'Numéro invalide. Format : +243812345678'; return; }
        err.textContent = '';
        const { data: rep, error } = await sb.rpc('enregistrer_telephone', { p_phone: p });
        if(error || rep !== 'ok'){
          err.textContent = rep === 'deja_utilise' ? 'Ce numéro est déjà utilisé par un autre compte.'
            : rep === 'invalide' ? 'Numéro invalide. Format : +243812345678'
            : 'Erreur : ' + (error ? error.message : rep);
          return;
        }
        o.remove(); resolve(p);
      };
    });
  }
  const $ = id => document.getElementById(id);
  let moi = null, canal = null;

  const esc = s => String(s ?? '').replace(/[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function montrer(id) {
    ['login', 'attente', 'accueil', 'chat'].forEach(x => $(x).classList.toggle('hidden', x !== id));
  }

  async function demarrer() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return montrer('login');
    const { data: p } = await sb.from('profiles').select('nom,statut,is_admin,phone').eq('id', session.user.id).single();
    moi = { id: session.user.id, ...p };
    if (p && p.statut !== 'banni' && !p.phone) {
      const ph = await askPhone();
      if (!ph) return;
      p.phone = ph; moi.phone = ph;
    }
    if (p && p.statut !== 'banni' && !p.is_admin && !(await visageEnregistre())) {
      if (!(await askVisage())) return;
    }
    if (!p || p.statut !== 'admis') {
      const banni = p && p.statut === 'banni';
      $('attente-titre').textContent = banni ? 'Compte banni' : 'Compte en attente';
      $('attente-msg').textContent = banni
        ? "L'administrateur a banni ce compte."
        : "Ton compte doit être validé par l'administrateur avant d'accéder au chat.";
      return montrer('attente');
    }
    montrer('accueil');
    await chargerAnnuaire();
    $('mi-admin').classList.toggle('hidden', !moi.is_admin);
    $('mi-reglages').classList.toggle('hidden', !moi.is_admin);
    await chargerMessages();
    ecouter();
    try { ecouterPrive(); chargerNonLus(); chargerAccueil(); setTimeout(chargerAccueil, 2500); } catch (e) {}
  }

  async function connexion(creer) {
    const email = $('email').value.trim(), password = $('mdp').value;
    if (!email || !password) return alert('Entre ton e-mail et ton mot de passe.');
    const r = creer ? await sb.auth.signUp({ email, password })
                    : await sb.auth.signInWithPassword({ email, password });
    if (r.error) return alert(r.error.message);
    if (creer && !r.data.session) return alert('Compte créé. Confirme ton e-mail, puis connecte-toi.');
    demarrer();
  }

  async function deconnexion() {
    if (canal) sb.removeChannel(canal);
    await sb.auth.signOut();
    montrer('login');
  }

  const msgs = {};
  let annuaire = {}, tels = {};

  async function chargerAnnuaire() {
    const { data } = await sb.rpc('annuaire');
    annuaire = {};
    (data || []).forEach(p => { annuaire[p.id] = p; });
    try { const t = await sb.rpc('annuaire_tel'); tels = {}; (t.data || []).forEach(x => { tels[x.id] = x; }); } catch (e) {}
  }

  function avatarDe(id, nom) {
    const p = annuaire[id];
    if (p && p.photo_url) {
      const url = sb.storage.from('avatars').getPublicUrl(p.photo_url).data.publicUrl;
      return `<img class="av" src="${esc(url)}">`;
    }
    return `<span class="ini">${esc((nom || '?').charAt(0).toUpperCase())}</span>`;
  }

  function recu(m) {
    if (m.auteur && !annuaire[m.auteur]) chargerAnnuaire().then(() => ajouter(m));
    else ajouter(m);
  }

  function texteMsg(m) {
    return esc(m.contenu) + (m.modifie ? ' <small style="color:#8696a0">(modifié)</small>' : '');
  }

  function tombe(m) {
    const soi = m.supprime_par === m.auteur_nom;
    return '<em style="color:#8696a0">🚫 ' + (soi ? 'Ce message a été supprimé'
      : "Message supprimé par l'admin " + esc(m.supprime_par)) + '</em>';
  }

  function majMessage(m) {
    msgs[m.id] = m;
    const el = $('m' + m.id);
    if (!el) return;
    if (m.supprime) el.innerHTML = tombe(m);
    else if (m.type === 'texte') el.innerHTML = texteMsg(m);
  }

  let dernierJour = '';

  function libelleJour(d) {
    const hier = new Date(Date.now() - 864e5);
    if (d.toDateString() === new Date().toDateString()) return "Aujourd'hui";
    if (d.toDateString() === hier.toDateString()) return 'Hier';
    return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  const COULEURS = ['#53bdeb', '#e9a23b', '#c6a3ff', '#ff8a8a', '#7fd67f', '#f0a1d1'];
  const couleurDe = nom => COULEURS[[...String(nom || '')].reduce((a, c) => a + c.charCodeAt(0), 0) % COULEURS.length];

  function ajouter(m) {
    msgs[m.id] = m;
    const estMoi = m.auteur === moi.id, media = m.type !== 'texte' && !m.supprime;
    const corps = m.supprime ? tombe(m) : media ? '…' : texteMsg(m);
    const d = new Date(m.created_at || Date.now());
    if (d.toDateString() !== dernierJour) {
      dernierJour = d.toDateString();
      $('zone').insertAdjacentHTML('beforeend', `<div class="jour">${libelleJour(d)}</div>`);
    }
    const heure = d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    const nom = estMoi ? '' : `<span class="nom" style="color:${couleurDe(m.auteur_nom)};cursor:pointer" onclick="ouvrirContact('${m.auteur}')">${esc(m.auteur_nom)}</span>`;
    $('zone').insertAdjacentHTML('beforeend',
      `<div class="rang ${estMoi ? 'moi' : 'autre'}">${estMoi ? '' : `<span onclick="ouvrirContact('${m.auteur}')" style="cursor:pointer;display:flex;flex:none">${avatarDe(m.auteur, m.auteur_nom)}</span>`}` +
      `<div id="b${m.id}" class="bulle ${estMoi ? 'moi' : 'autre'}">${nom}<span id="m${m.id}">${corps}</span><span class="heure">${heure}</span></div></div>`);
    $('zone').scrollTop = $('zone').scrollHeight;
    if (media) afficherMedia(m);
  }

  async function afficherMedia(m) {
    const { data } = await sb.storage.from('chat').createSignedUrl(m.contenu, 3600);
    const url = data ? esc(data.signedUrl) : '';
    $('m' + m.id).innerHTML = !url ? '(fichier indisponible)'
      : m.type === 'image' ? `<img src="${url}" onclick="voirPhoto(this.src)" onload="$('zone').scrollTop=$('zone').scrollHeight">`
      : `<audio controls src="${url}"></audio>`;
  }

  async function chargerMessages() {
    const { data } = await sb.from('messages').select('*')
      .order('created_at', { ascending: false }).limit(100);
    $('zone').innerHTML = '';
    for (const k in msgs) delete msgs[k];
    dernierJour = '';
    (data || []).reverse().forEach(ajouter);
  }

  function ecouter() {
    if (canal) sb.removeChannel(canal);
    canal = sb.channel('chat-general')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, p => recu(p.new))
      .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages' }, p => retirer(p.old.id))
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'messages' }, p => majMessage(p.new))
      .subscribe();
  }

  const ETIQUETTE = { en_attente: 'En attente', admis: 'Admis', banni: 'Banni' };

  function fermerAdmin() { $('admin').classList.add('hidden'); }

  async function ouvrirAdmin() {
    $('admin').classList.remove('hidden');
    const { data, error } = await sb.from('profiles')
      .select('id,nom,statut,created_at').order('created_at', { ascending: false });
    if (error) return alert(error.message);
    $('liste').innerHTML = data.map(p => {
      let actions = '<small>Toi</small>';
      if (p.id !== moi.id) {
        actions = (p.statut !== 'admis' ? `<button class="primaire" onclick="changerStatut('${p.id}','admis')">Admettre</button>` : '')
                + (p.statut !== 'banni' ? `<button class="danger" onclick="changerStatut('${p.id}','banni')">Bannir</button>` : '');
      }
      return `<div class="ligne"><div>${esc(p.nom)}<small>${ETIQUETTE[p.statut] || ''}</small></div><div>${actions}${p.id !== moi.id ? `<button class="secondaire" onclick="reinitVisage('${p.id}')">Visage</button>` : ''}</div></div>`;
    }).join('');
  }

  async function changerStatut(id, statut) {
    if (statut === 'banni' && !confirm('Bannir ce compte ?')) return;
    const { error } = await sb.from('profiles').update({ statut }).eq('id', id);
    if (error) return alert(error.message);
    ouvrirAdmin();
  }

  async function televerser(blob, type, ext, contentType) {
    const chemin = `${moi.id}/${Date.now()}.${ext}`;
    const { error } = await sb.storage.from('chat').upload(chemin, blob, { contentType });
    if (error) return alert('Envoi impossible : ' + error.message);
    const r = await sb.from('messages').insert({ auteur: moi.id, type, contenu: chemin });
    if (r.error) { alert('Message non envoyé : ' + r.error.message); demarrer(); }
  }

  function reduire(file) {
    return new Promise((ok, ko) => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, 1280 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k);
        c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(b => b ? ok(b) : ko(new Error('Image illisible')), 'image/jpeg', 0.8);
      };
      img.onerror = () => ko(new Error('Image illisible'));
      img.src = URL.createObjectURL(file);
    });
  }

  async function envoyerPhoto(input) {
    const f = input.files[0];
    input.value = '';
    if (!f) return;
    try { await televerser(await reduire(f), 'image', 'jpg', 'image/jpeg'); }
    catch (e) { alert(e.message); }
  }

  let enregistreur = null, morceaux = [], envoyerVocal = false, chrono = null;

  function afficherChrono(t0) {
    const sec = Math.floor((Date.now() - t0) / 1000);
    $('chrono').textContent = Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
  }

  async function demarrerVocal() {
    try {
      const flux = await navigator.mediaDevices.getUserMedia({ audio: true });
      const rec = new MediaRecorder(flux);
      morceaux = [];
      rec.ondataavailable = e => morceaux.push(e.data);
      rec.onstop = async () => {
        clearInterval(chrono);
        flux.getTracks().forEach(t => t.stop());
        $('enreg').classList.add('hidden');
        $('saisie').classList.remove('hidden');
        enregistreur = null;
        const blob = new Blob(morceaux, { type: 'audio/webm' });
        if (envoyerVocal && blob.size > 1000) await televerser(blob, 'vocal', 'webm', 'audio/webm');
      };
      rec.start();
      enregistreur = rec;
      const t0 = Date.now();
      afficherChrono(t0);
      chrono = setInterval(() => afficherChrono(t0), 500);
      $('saisie').classList.add('hidden');
      $('enreg').classList.remove('hidden');
    } catch (e) { alert('Micro indisponible : ' + e.message); }
  }

  function finirVocal(envoyer) {
    if (!enregistreur) return;
    envoyerVocal = envoyer;
    enregistreur.stop();
  }

  function carre(file, t) {
    return new Promise((ok, ko) => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = c.height = t;
        const m = Math.min(img.width, img.height);
        c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, t, t);
        c.toBlob(b => b ? ok(b) : ko(new Error('Image illisible')), 'image/jpeg', 0.85);
      };
      img.onerror = () => ko(new Error('Image illisible'));
      img.src = URL.createObjectURL(file);
    });
  }

  function ouvrirProfil() {
    $('profil-av').innerHTML = avatarDe(moi.id, moi.nom);
    $('profil-nom').textContent = moi.nom || '';
    $('profil-tel').textContent = moi.phone ? '📞 ' + moi.phone : '';
    $('profil').classList.remove('hidden');
  }

  async function changerPhoto(input) {
    const f = input.files[0];
    input.value = '';
    if (!f) return;
    try {
      const chemin = `${moi.id}/${Date.now()}.jpg`;
      const up = await sb.storage.from('avatars').upload(chemin, await carre(f, 256), { contentType: 'image/jpeg' });
      if (up.error) throw up.error;
      const r = await sb.rpc('changer_photo', { p_chemin: chemin });
      if (r.error) throw r.error;
      await chargerAnnuaire();
      ouvrirProfil();
      await chargerMessages();
    } catch (e) { alert('Photo non enregistrée : ' + e.message); }
  }

  // Photo en grand, suppression par appui long
  let appuiLong = false, minuteur = null;

  function voirPhoto(src) {
    if (appuiLong) { appuiLong = false; return; }
    $('visio-img').src = src;
    $('visio').classList.remove('hidden');
  }

  function retirer(id) {
    const el = $('b' + id);
    if (el) (el.closest('.rang') || el).remove();
    delete msgs[id];
  }

  let choisi = null, edition = null;

  function ouvrirMenu(id) {
    const m = msgs[id];
    if (!m || m.supprime) return;
    const perso = m.auteur === moi.id;
    if (!perso && !moi.is_admin) return;
    $('menu-modif').classList.toggle('hidden', !(perso && m.type === 'texte'));
    $('menu-suppr').classList.toggle('hidden', !(perso || moi.is_admin));
    choisi = id;
    $('menu').classList.remove('hidden');
  }

  function fermerMenu() { $('menu').classList.add('hidden'); }

  function supprimerChoisi() { fermerMenu(); supprimer(choisi); }

  function commencerEdition() {
    fermerMenu();
    const m = msgs[choisi];
    if (!m) return;
    edition = m.id;
    $('texte').value = m.contenu;
    $('bandeau').classList.remove('hidden');
    $('texte').focus();
  }

  function annulerEdition() {
    edition = null;
    $('texte').value = '';
    $('bandeau').classList.add('hidden');
  }

  async function supprimer(id) {
    const m = msgs[id];
    if (!m || m.supprime || !(m.auteur === moi.id || moi.is_admin)) return;
    const { data: chemin, error } = await sb.rpc('supprimer_message', { p_id: Number(id) });
    if (error) return alert('Suppression impossible : ' + error.message);
    if (chemin && m.type !== 'texte') await sb.storage.from('chat').remove([chemin]);
    majMessage({ ...m, supprime: true, supprime_par: moi.nom, contenu: null });
  }

  $('zone').addEventListener('touchstart', e => {
    appuiLong = false;
    const b = e.target.closest('.bulle');
    if (!b) return;
    clearTimeout(minuteur);
    minuteur = setTimeout(() => { appuiLong = true; ouvrirMenu(b.id.slice(1)); }, 600);
  }, { passive: true });
  ['touchend', 'touchmove', 'touchcancel'].forEach(t =>
    $('zone').addEventListener(t, () => clearTimeout(minuteur), { passive: true }));

  async function envoyer() {
    const t = $('texte').value.trim();
    if (!t) return;
    if (edition) {
      const id = edition;
      annulerEdition();
      const { data, error } = await sb.from('messages').update({ contenu: t }).eq('id', id).select();
      if (error || !data || !data.length) alert('Modification refusée.');
      else majMessage(data[0]);
      return;
    }
    $('texte').value = '';
    const { error } = await sb.from('messages').insert({ auteur: moi.id, type: 'texte', contenu: t });
    if (error) { alert("Message non envoyé : " + error.message); demarrer(); }
  }

  // Connexion Google : dans l'app, on ouvre le navigateur puis on revient par un lien
  const RETOUR = 'com.kaabu.agent://login-callback';
  const natif = () => !!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform());

  async function connexionGoogle() {
    const nat = natif();
    const { data, error } = await sb.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: nat ? RETOUR : window.location.origin, skipBrowserRedirect: nat }
    });
    if (error) return alert(error.message);
    if (nat) {
      const nav = Capacitor.Plugins && Capacitor.Plugins.Browser;
      if (!nav) return alert("Mets l'application à jour pour utiliser Google.");
      await nav.open({ url: data.url });
    }
  }

  async function finirGoogle(url) {
    try {
      const u = new URL(url);
      const code = u.searchParams.get('code');
      const err = u.searchParams.get('error_description');
      if (err) throw new Error(err);
      if (code) {
        const { error } = await sb.auth.exchangeCodeForSession(code);
        if (error) throw error;
      }
      const nav = Capacitor.Plugins && Capacitor.Plugins.Browser;
      try { if (nav) await nav.close(); } catch (e) {}
      demarrer();
    } catch (e) { alert('Connexion Google échouée : ' + e.message); }
  }

  if (natif() && Capacitor.Plugins && Capacitor.Plugins.App) {
    Capacitor.Plugins.App.addListener('appUrlOpen', ev => {
      if (ev.url && ev.url.startsWith(RETOUR)) finirGoogle(ev.url);
    });
  }

  demarrer();
</script>

<script>
async function chargerConfig(){
  try{
    const r = await sb.from('config').select('app_name,app_logo').eq('id',1).single();
    const d = r.data; if(!d) return;
    if(d.app_name){ $('titre-app').textContent = d.app_name; document.title = d.app_name; }
    const l = $('logo-app');
    if(d.app_logo){ l.src = d.app_logo; l.classList.remove('hidden'); } else { l.classList.add('hidden'); }
  }catch(e){}
}
function logoEnDataUrl(file, t){
  return new Promise(function(ok, ko){
    var img = new Image(), u = URL.createObjectURL(file);
    img.onload = function(){
      var c = document.createElement('canvas'); c.width = t; c.height = t;
      var s = Math.min(img.width, img.height);
      c.getContext('2d').drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, t, t);
      URL.revokeObjectURL(u); ok(c.toDataURL('image/png'));
    };
    img.onerror = ko; img.src = u;
  });
}
function ouvrirReglages(){
  var o = document.createElement('div');
  o.style.cssText = 'position:fixed;inset:0;background:#111b21;z-index:9999;display:flex;flex-direction:column;justify-content:center;padding:24px;gap:12px;color:#fff';
  o.innerHTML = '<h2>Réglages de l\'app</h2>' +
    '<label>Nom de l\'app</label><input id="rg-nom" type="text" style="padding:12px;font-size:16px;border-radius:8px;border:0">' +
    '<label>Logo (image carrée de préférence)</label>' +
    '<div style="display:flex;align-items:center;gap:12px"><img id="rg-apercu" style="width:64px;height:64px;border-radius:12px;object-fit:cover;background:#2a3942"><input id="rg-fichier" type="file" accept="image/*"></div>' +
    '<div id="rg-err" style="color:#ff6b6b"></div>' +
    '<button id="rg-ok" style="padding:12px;font-size:16px;border:0;border-radius:8px;background:#00a884;color:#fff">Enregistrer</button>' +
    '<button id="rg-non" style="padding:12px;font-size:16px;border:0;border-radius:8px;background:#2a3942;color:#fff">Annuler</button>';
  document.body.appendChild(o);
  var nom = o.querySelector('#rg-nom'), ap = o.querySelector('#rg-apercu'), fi = o.querySelector('#rg-fichier'), err = o.querySelector('#rg-err');
  nom.value = $('titre-app').textContent;
  var lg = $('logo-app'); if(!lg.classList.contains('hidden')) ap.src = lg.src;
  var nouveau = null;
  fi.onchange = async function(){
    if(!fi.files[0]) return;
    try{ nouveau = await logoEnDataUrl(fi.files[0], 192); ap.src = nouveau; }catch(e){ err.textContent = 'Image illisible.'; }
  };
  o.querySelector('#rg-non').onclick = function(){ o.remove(); };
  o.querySelector('#rg-ok').onclick = async function(){
    var n = nom.value.trim();
    if(!n){ err.textContent = 'Le nom ne peut pas être vide.'; return; }
    var m = { app_name: n }; if(nouveau) m.app_logo = nouveau;
    var r = await sb.from('config').update(m).eq('id',1).select();
    if(r.error){ err.textContent = 'Erreur : ' + r.error.message; return; }
    if(!r.data || !r.data.length){ err.textContent = 'Refusé : réservé à l\'admin (ou table config absente).'; return; }
    o.remove(); chargerConfig();
  };
}
window.addEventListener('load', chargerConfig);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) chargerConfig(); });

async function envoyerFichier(inp){
  var f = inp.files[0]; inp.value = ''; if(!f) return;
  if(f.size > 20*1024*1024){ alert('Fichier trop lourd (20 Mo maximum).'); return; }
  var nom = f.name.replace(/[^A-Za-z0-9._-]+/g,'_').slice(-80);
  var chemin = moi.id + '/' + Date.now() + '__' + nom;
  var up = await sb.storage.from('chat').upload(chemin, f, { contentType: f.type || 'application/octet-stream' });
  if(up.error){ alert('Envoi impossible : ' + up.error.message); return; }
  var r = await sb.from('messages').insert({ auteur: moi.id, type: 'fichier', contenu: chemin });
  if(r.error){ alert('Message non envoyé : ' + r.error.message); }
}
function lienFichier(m, url){
  var n = m.contenu.split('__').slice(1).join('__') || 'fichier';
  return '<a href="' + url + '" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:8px;color:inherit;text-decoration:none"><i class="fa-solid fa-file"></i><span style="word-break:break-all">' + esc(n) + '</span></a>';
}
var _afficherMediaOrig = afficherMedia;
afficherMedia = async function(m){
  if(m.type !== 'fichier') return _afficherMediaOrig(m);
  var r = await sb.storage.from('chat').createSignedUrl(m.contenu, 3600);
  var url = r.data ? esc(r.data.signedUrl) : '';
  $('m' + m.id).innerHTML = url ? lienFichier(m, url) : '(fichier indisponible)';
};
</script>
<script>
async function initPush(){
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:99999;background:#000;color:#0f0;font:11px monospace;padding:8px;border-radius:8px;white-space:pre-wrap;max-height:40vh;overflow:auto';
  document.body.appendChild(d);
  function log(s){ d.textContent += s + '\n'; }
  try{
    log('Capacitor: ' + (!!window.Capacitor));
    log('natif: ' + (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()));
    log('plugins: ' + (window.Capacitor && window.Capacitor.Plugins ? Object.keys(window.Capacitor.Plugins).join(', ') : 'aucun'));
    if (!window.Capacitor || !window.Capacitor.isNativePlatform || !window.Capacitor.isNativePlatform()) { log('arret: pas natif'); return; }
    const P = window.Capacitor.Plugins && window.Capacitor.Plugins.PushNotifications;
    if (!P) { log('arret: PushNotifications absent'); return; }
    const perm = await P.checkPermissions();
    log('perm actuelle: ' + JSON.stringify(perm));
    if (perm.receive !== 'granted') {
      const req = await P.requestPermissions();
      log('perm demandee: ' + JSON.stringify(req));
      if (req.receive !== 'granted') { log('arret: refuse'); return; }
    }
    await P.register();
    log('register() appele');
    P.addListener('registration', async (t) => {
      log('jeton recu, longueur ' + t.value.length);
      try{ const r = await sb.rpc('enregistrer_jeton', { t: t.value }); log('rpc: ' + JSON.stringify(r.error || 'ok')); }catch(e){ log('rpc erreur: ' + e.message); }
    });
    P.addListener('registrationError', (e) => log('erreur registration: ' + JSON.stringify(e)));
  }catch(e){ log('exception: ' + e.message); }
}
window.addEventListener('load', () => setTimeout(initPush, 1500));
</script>

<script>
let canalP = null, priveId = null, nonLus = new Set();
const vuCle = id => 'prive_vu_' + moi.id + '_' + id;
const nomDe = id => (tels[id] && tels[id].nom) || (annuaire[id] && annuaire[id].nom) || 'Membre';
function majPointMembres(){ const b = $('btn-membres'); if (b) b.style.color = nonLus.size ? '#00a884' : ''; }
function marquerVu(id){ try { localStorage.setItem(vuCle(id), new Date().toISOString()); } catch (e) {} nonLus.delete(id); majPointMembres(); }

async function ouvrirMembres(){
  await chargerAnnuaire();
  const l = Object.values(tels).sort((a, b) => (a.nom || '').localeCompare(b.nom || ''));
  $('liste-membres').innerHTML = l.map(p =>
    `<div class="ligne" style="cursor:pointer" onclick="$('membres').classList.add('hidden');ouvrirContact('${p.id}')">` +
    `<div style="display:flex;align-items:center;gap:10px">${avatarDe(p.id, p.nom)}<div>${esc(p.nom)}${p.id === moi.id ? ' (toi)' : ''}<small>${esc(p.phone || 'Numéro non renseigné')}</small></div></div>` +
    `<div>${nonLus.has(p.id) ? '<i class="fa-solid fa-circle" style="color:#00a884;font-size:.7rem"></i>' : ''}</div></div>`).join('')
    || '<p style="padding:16px">Aucun membre.</p>';
  $('membres').classList.remove('hidden');
}

async function ouvrirContact(id){
  if (!id) return;
  if (!tels[id]) await chargerAnnuaire();
  const t = tels[id] || {}, nom = t.nom || nomDe(id), tel = t.phone || '';
  $('contact-av').innerHTML = avatarDe(id, nom);
  $('contact-nom').textContent = nom;
  $('contact-tel').textContent = tel || 'Numéro non renseigné';
  const bt = 'display:block;width:100%;box-sizing:border-box;padding:12px;margin-top:8px;border-radius:8px;font-weight:600;font-size:1rem;text-decoration:none;text-align:center;border:0;';
  $('contact-actions').innerHTML = id === moi.id ? '' :
    (tel ? `<a href="tel:${esc(tel)}" style="${bt}background:#00a884;color:#111b21"><i class="fa-solid fa-phone"></i>&nbsp; Appeler</a>` : '') +
    `<button style="${bt}background:#2a3942;color:#e9edef" onclick="ouvrirPrive('${id}')"><i class="fa-solid fa-comment"></i>&nbsp; Discuter en privé</button>`;
  $('contact').classList.remove('hidden');
}
function fermerContact(){ $('contact').classList.add('hidden'); }

function ajouterPrive(m){
  if (!priveId || !((m.de === moi.id && m.a === priveId) || (m.de === priveId && m.a === moi.id))) return;
  if ($('p' + m.id)) return;
  const estMoi = m.de === moi.id, d = new Date(m.created_at || Date.now());
  const h = d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  $('prive-zone').insertAdjacentHTML('beforeend',
    `<div class="rang ${estMoi ? 'moi' : 'autre'}"><div id="p${m.id}" class="bulle ${estMoi ? 'moi' : 'autre'}">${esc(m.contenu)}<span class="heure">${h}</span></div></div>`);
  $('prive-zone').scrollTop = $('prive-zone').scrollHeight;
}

async function ouvrirPrive(id){
  fermerContact();
  priveId = id;
  $('prive-nom').textContent = nomDe(id);
  const tel = tels[id] && tels[id].phone;
  $('prive-appel').innerHTML = tel ? `<a href="tel:${esc(tel)}" style="color:inherit"><i class="fa-solid fa-phone"></i></a>` : '';
  $('prive-zone').innerHTML = '';
  $('prive').classList.remove('hidden');
  const { data, error } = await sb.from('prives').select('*')
    .or(`and(de.eq.${moi.id},a.eq.${id}),and(de.eq.${id},a.eq.${moi.id})`)
    .order('created_at', { ascending: false }).limit(100);
  if (error) { $('prive-zone').textContent = 'Erreur : ' + error.message; return; }
  (data || []).reverse().forEach(ajouterPrive);
  marquerVu(id);
}

function fermerPrive(){
  if (priveId) marquerVu(priveId);
  priveId = null;
  $('prive').classList.add('hidden');
}

async function envoyerPrive(){
  const t = $('prive-texte').value.trim();
  if (!t || !priveId) return;
  $('prive-texte').value = '';
  const { data, error } = await sb.from('prives').insert({ de: moi.id, a: priveId, contenu: t }).select();
  if (error) { alert('Message non envoyé : ' + error.message); return; }
  if (data && data[0]) ajouterPrive(data[0]);
}

function toastPrive(id){
  const d = document.createElement('div');
  d.textContent = '💬 Message privé de ' + nomDe(id);
  d.style.cssText = 'position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:99998;background:#075e54;color:#fff;padding:10px 16px;border-radius:20px;font:14px sans-serif;cursor:pointer';
  d.onclick = () => { d.remove(); ouvrirPrive(id); };
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 5000);
}

function ecouterPrive(){
  if (canalP) sb.removeChannel(canalP);
  canalP = sb.channel('chat-prive')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'prives' }, p => {
      const m = p.new;
      setTimeout(chargerAccueil, 300);
      if (m.de === moi.id) return ajouterPrive(m);
      if (m.a !== moi.id) return;
      if (priveId === m.de) { ajouterPrive(m); marquerVu(m.de); }
      else { nonLus.add(m.de); majPointMembres(); toastPrive(m.de); }
    }).subscribe();
}

async function chargerNonLus(){
  try {
    const { data } = await sb.from('prives').select('de,created_at').eq('a', moi.id)
      .order('created_at', { ascending: false }).limit(200);
    const der = {};
    (data || []).forEach(m => { if (!der[m.de]) der[m.de] = m.created_at; });
    for (const id in der) {
      let vu = null; try { vu = localStorage.getItem(vuCle(id)); } catch (e) {}
      if (!vu || new Date(der[id]) > new Date(vu)) nonLus.add(id);
    }
    majPointMembres();
  } catch (e) {}
}

var _deco = deconnexion;
deconnexion = async function(){
  if (canalP) { sb.removeChannel(canalP); canalP = null; }
  priveId = null; nonLus.clear(); tels = {};
  $('prive').classList.add('hidden');
  return _deco();
};

// Bouton retour d'Android
if (natif() && Capacitor.Plugins && Capacitor.Plugins.App) {
  Capacitor.Plugins.App.addListener('backButton', () => {
    if (!$('prive').classList.contains('hidden')) return fermerPrive();
    const tel = $('ov-tel'); if (tel) return $('phback').click();
    if ($('ov-visage')) return $('vback').click();
    for (const id of ['menuplus', 'contact', 'menu', 'visio', 'membres', 'profil', 'admin'])
      if (!$(id).classList.contains('hidden')) return $(id).classList.add('hidden');
    if (!$('chat').classList.contains('hidden')) return retourAccueil();
    Capacitor.Plugins.App.exitApp();
  });
}
</script>

<script>
let modelesOk = false;
const FA = 'https://cdn.jsdelivr.net/gh/vladmandic/face-api@1.7.12/';
function chargerScript(src){
  return new Promise((ok, ko) => {
    const s = document.createElement('script');
    s.src = src; s.onload = ok;
    s.onerror = () => ko(new Error('Chargement impossible. Vérifie ta connexion.'));
    document.head.appendChild(s);
  });
}
async function chargerModeles(){
  if (modelesOk) return;
  if (!window.faceapi) await chargerScript(FA + 'dist/face-api.js');
  const M = FA + 'model/';
  await Promise.all([
    faceapi.nets.tinyFaceDetector.loadFromUri(M),
    faceapi.nets.faceLandmark68Net.loadFromUri(M),
    faceapi.nets.faceRecognitionNet.loadFromUri(M)
  ]);
  modelesOk = true;
}
async function visageEnregistre(){
  const r = await sb.rpc('mon_visage_ok');
  return r.data === true;
}
function versCanvas(file){
  return new Promise((ok, ko) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 640 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src); ok(c);
    };
    img.onerror = () => ko(new Error('Photo illisible.'));
    img.src = URL.createObjectURL(file);
  });
}
function askVisage(){
  return new Promise(resolve => {
    const o = document.createElement('div');
    o.id = 'ov-visage';
    o.style.cssText = 'position:fixed;inset:0;background:#111b21;z-index:9999;display:flex;flex-direction:column;justify-content:center;padding:24px;gap:12px;color:#fff;overflow-y:auto';
    o.innerHTML = '<h2>Vérification du visage</h2><p>Pour éviter qu\'une même personne ouvre plusieurs comptes, prends un selfie. La photo n\'est pas conservée : seule une empreinte numérique de ton visage est enregistrée. Elle n\'est visible par personne et ne sert qu\'à cette vérification.</p><div id="vcadre" class="hidden" style="position:relative;width:100%;border-radius:12px;overflow:hidden;background:#000"><video id="vvid" autoplay playsinline muted style="display:block;width:100%;height:48vh;object-fit:cover;transform:scaleX(-1)"></video><div style="position:absolute;left:50%;top:50%;width:64%;height:78%;transform:translate(-50%,-50%);border:3px solid #00a884;border-radius:50%;box-shadow:0 0 0 200vmax rgba(17,27,33,.72);pointer-events:none"></div></div><div id="vmsg" style="color:#ff6b6b"></div><button id="vgo" style="padding:12px;font-size:16px;border:0;border-radius:8px;background:#00a884;color:#fff">J\'accepte · Ouvrir la caméra</button><button id="vback" style="padding:12px;font-size:16px;border:0;border-radius:8px;background:#2a3942;color:#fff">← Retour</button>';
    document.body.appendChild(o);
    const msg = o.querySelector('#vmsg'), go = o.querySelector('#vgo'), vid = o.querySelector('#vvid'), cadre = o.querySelector('#vcadre');
    let flux = null, pret = false;
    const arreter = () => { if (flux) flux.getTracks().forEach(t => t.stop()); flux = null; cadre.classList.add('hidden'); };
    o.querySelector('#vback').onclick = async () => { arreter(); o.remove(); await deconnexion(); resolve(false); };
    go.onclick = async () => {
      if (!pret) {
        msg.textContent = '';
        try {
          flux = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 } }, audio: false });
          vid.srcObject = flux; cadre.classList.remove('hidden');
          try { await vid.play(); } catch (e) {}
          pret = true; go.textContent = '📸 Prendre la photo';
          msg.style.color = '#8696a0'; msg.textContent = "Place ton visage dans l'ovale, sans masque ni lunettes, bien éclairé.";
        } catch (e) {
          msg.style.color = '#ff6b6b';
          msg.textContent = 'Caméra indisponible (' + e.name + '). Autorise la caméra pour l\'application, ou mets-la à jour.';
        }
        return;
      }
      go.disabled = true; msg.style.color = '#8696a0';
      msg.textContent = 'Analyse en cours… (le premier chargement peut durer un moment)';
      try {
        if (!vid.videoWidth) throw new Error('Caméra pas encore prête, réessaie.');
        const c = document.createElement('canvas');
        const bw = vid.clientWidth, bh = vid.clientHeight, vw = vid.videoWidth, vh = vid.videoHeight;
        const k = Math.max(bw / vw, bh / vh), sw = bw / k, sh = bh / k;
        c.width = Math.round(sw); c.height = Math.round(sh);
        c.getContext('2d').drawImage(vid, (vw - sw) / 2, (vh - sh) / 2, sw, sh, 0, 0, c.width, c.height);
        arreter(); pret = false;
        await chargerModeles();
        const det = await faceapi.detectSingleFace(c, new faceapi.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.5 })).withFaceLandmarks().withFaceDescriptor();
        if (!det) throw new Error("Aucun visage détecté. Enlève le masque, regarde la caméra de face, avec une bonne lumière.");
        const bx = det.detection.box, W = c.width, H = c.height;
        if (bx.width < 0.35 * W) throw new Error("Rapproche-toi : ton visage doit remplir l'ovale.");
        if (bx.width > 0.85 * W) throw new Error("Éloigne-toi un peu : ton visage doit tenir dans l'ovale.");
        if (Math.abs(bx.x + bx.width / 2 - W / 2) > 0.18 * W || Math.abs(bx.y + bx.height / 2 - H / 2) > 0.2 * H)
          throw new Error("Centre ton visage dans l'ovale.");
        const emp = Array.from(det.descriptor, x => Math.round(x * 1e5) / 1e5);
        const r = await sb.rpc('enregistrer_visage', { p_desc: emp });
        if (r.error || r.data !== 'ok') throw new Error(
          r.data === 'deja_utilise' ? 'Ce visage est déjà associé à un autre compte.'
          : r.data === 'invalide' ? 'Empreinte invalide, réessaie.'
          : 'Erreur : ' + (r.error ? r.error.message : r.data));
        o.remove(); resolve(true);
      } catch (e) {
        arreter(); pret = false;
        msg.style.color = '#ff6b6b'; msg.textContent = e.message;
        go.disabled = false; go.textContent = 'Réessayer (ouvrir la caméra)';
      }
    };
  });
}
async function reinitVisage(id){
  if (!confirm('Réinitialiser le visage de ce compte ? Il devra refaire un selfie.')) return;
  const r = await sb.rpc('reinitialiser_visage', { p_id: id });
  if (r.error || r.data !== 'ok') return alert('Refusé : ' + (r.error ? r.error.message : r.data));
  alert('Visage réinitialisé.');
}
</script>

<script>
const vuGroupe = () => 'groupe_vu_' + moi.id;
let accEnCours = false, accRefaire = false;
function ouvrirMenuPlus(){ $('menuplus').classList.remove('hidden'); }
function fermerMenuPlus(){ $('menuplus').classList.add('hidden'); }
function heureConv(iso){
  const d = new Date(iso), n = new Date();
  if (d.toDateString() === n.toDateString()) return d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  if (d.toDateString() === new Date(Date.now() - 864e5).toDateString()) return 'Hier';
  return d.toLocaleDateString('fr-FR');
}
function apercuGroupe(m){
  if (m.supprime) return '🚫 Message supprimé';
  const qui = m.auteur === moi.id ? 'Toi : ' : (m.auteur_nom ? m.auteur_nom + ' : ' : '');
  const c = m.type === 'image' ? '📷 Photo' : m.type === 'vocal' ? '🎤 Message vocal' : m.type === 'fichier' ? '📎 Fichier' : (m.contenu || '');
  return qui + c;
}
function marquerGroupeVu(){ try { localStorage.setItem(vuGroupe(), new Date().toISOString()); } catch (e) {} }
function ouvrirGroupe(){
  montrer('chat'); marquerGroupeVu();
  $('zone').scrollTop = $('zone').scrollHeight;
}
function retourAccueil(){
  marquerGroupeVu(); montrer('accueil'); chargerAccueil();
}
async function rendreAccueil(){
  $('titre-acc').textContent = $('titre-app').textContent;
  const lg = $('logo-app'), logo = (!lg.classList.contains('hidden') && lg.src) || '';
  if (logo) { $('logo-acc').src = logo; $('logo-acc').classList.remove('hidden'); }
  let vu = null;
  try { vu = localStorage.getItem(vuGroupe()); if (!vu) { vu = new Date().toISOString(); localStorage.setItem(vuGroupe(), vu); } } catch (e) {}
  const [g, gc, pv] = await Promise.all([
    sb.from('messages').select('contenu,type,supprime,auteur,auteur_nom,created_at').order('created_at', { ascending: false }).limit(1),
    sb.from('messages').select('id', { count: 'exact', head: true }).gt('created_at', vu || new Date().toISOString()).neq('auteur', moi.id),
    sb.from('prives').select('*').or(`de.eq.${moi.id},a.eq.${moi.id}`).order('created_at', { ascending: false }).limit(300)
  ]);
  const m = g.data && g.data[0];
  const items = [{ groupe: true, t: m ? m.created_at : '1970-01-01', apercu: m ? apercuGroupe(m) : 'Aucun message', n: gc.count || 0 }];
  const par = {};
  (pv.data || []).forEach(x => {
    const autre = x.de === moi.id ? x.a : x.de;
    if (!par[autre]) par[autre] = { id: autre, t: x.created_at, apercu: (x.de === moi.id ? 'Toi : ' : '') + x.contenu, n: 0 };
    if (x.a === moi.id) {
      let v = null; try { v = localStorage.getItem(vuCle(autre)); } catch (e) {}
      if (!v || new Date(x.created_at) > new Date(v)) par[autre].n++;
    }
  });
  Object.values(par).forEach(c => items.push(c));
  items.sort((a, b) => new Date(b.t) - new Date(a.t));
  $('liste-conv').innerHTML = items.map(c => {
    const av = c.groupe ? (logo ? `<img src="${esc(logo)}">` : '<i class="fa-solid fa-users"></i>') : avatarDe(c.id, nomDe(c.id));
    const nom = c.groupe ? 'Groupe général' : nomDe(c.id);
    const clic = c.groupe ? 'ouvrirGroupe()' : `ouvrirPrive('${c.id}')`;
    const h = c.t > '1971' ? heureConv(c.t) : '';
    return `<div class="conv" onclick="${clic}"><div class="conv-av">${av}</div><div class="conv-mid">` +
      `<div class="conv-top"><strong>${esc(nom)}</strong><small${c.n ? ' style="color:#00a884"' : ''}>${h}</small></div>` +
      `<div class="conv-bot"><span class="conv-txt">${esc(c.apercu)}</span>${c.n ? `<span class="badge">${c.n}</span>` : ''}</div></div></div>`;
  }).join('') + (items.length === 1 ? '<p style="color:#8696a0;text-align:center;padding:24px 16px">Touche le bouton 💬 pour écrire en privé à un membre.</p>' : '');
}
async function chargerAccueil(){
  if (!moi) return;
  if (accEnCours) { accRefaire = true; return; }
  accEnCours = true;
  try { await rendreAccueil(); } catch (e) {}
  accEnCours = false;
  if (accRefaire) { accRefaire = false; chargerAccueil(); }
}
var _recu = recu;
recu = function(m){ _recu(m); setTimeout(chargerAccueil, 300); };
var _fermerPrive = fermerPrive;
fermerPrive = function(){ _fermerPrive(); chargerAccueil(); };
document.addEventListener('visibilitychange', function(){ if (!document.hidden) chargerAccueil(); });
</script>
