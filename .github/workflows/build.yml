name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Restore signing key
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > ~/.android/debug.keystore

      - name: Check signing key
        run: |
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep SHA256
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep -q "27:55:AE:3D:B4:04:1E:17" || { echo "MAUVAISE CLE"; exit 1; }

      - name: Set version
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Check APK signature
        run: |
          AS=$(ls -d $ANDROID_HOME/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$AS" ]; then echo "APKSIGNER ABSENT: verification ignoree"; exit 0; fi
          $AS verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep "SHA-256"
          $AS verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -qi "2755ae3db4041e17" || { echo "MAUVAISE SIGNATURE"; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk telecom-rdc.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest telecom-rdc.apk --title "Telecom RDC ${{ github.run_number }}" --notes "versionCode ${{ github.run_number }}" --target ${{ github.sha }}
